# Builds the addon ZIP and publishes it as a GitHub release. Two ways in:
#
# * From GitHub, no git needed: Actions > Release > Run workflow, pick the
#   branch (main) and enter the tag, e.g. v0.7.4001-p1. The workflow creates
#   the tag on that branch's newest commit, together with the release.
# * With git: git tag v0.7.4001-p1 && git push origin v0.7.4001-p1
#
# Either way "## Version:" in EldoUI/EldoUI.toc must say the same
# (0.7.4001-p1), every check must pass, or nothing is published. A release
# made by hand on GitHub for the same tag gets the ZIP added to it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag für das Release, z. B. v0.7.4001-p1 (wie ## Version in EldoUI/EldoUI.toc, mit v davor)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Tag prüfen
        if: github.event_name == 'workflow_dispatch'
        run: |
          if ! [[ "$TAG" =~ ^v[0-9][0-9A-Za-z.-]*$ ]]; then
            echo "::error::Tag '$TAG' sieht nicht wie v<Version> aus, z. B. v0.7.4001-p1"
            exit 1
          fi
          existing=$(git ls-remote origin "refs/tags/$TAG^{}" "refs/tags/$TAG" | head -n 1 | cut -f1)
          if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
            echo "::error::Den Tag $TAG gibt es schon, für einen anderen Stand ($existing). Neue Version: neuer Tag."
            exit 1
          fi

      - name: Lua 5.1 und luacheck installieren
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends lua5.1 lua-check

      - name: Alle Prüfungen
        run: tools/ci/check_all.sh

      - name: Addon-ZIP bauen
        id: zip
        run: python3 tools/ci/build_zip.py --tag "$TAG"

      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ZIP: ${{ steps.zip.outputs.zip }}
          VERSION: ${{ steps.zip.outputs.version }}
          SHA256: ${{ steps.zip.outputs.sha256 }}
        run: |
          interface=$(sed -n 's/^## Interface: *\([0-9]*\).*/\1/p' EldoUI/EldoUI.toc)
          cat > notes.md <<EOF
          conUI ${VERSION}: EldoUI ${VERSION%-p*} mit den Ergänzungen dieses Forks: deutsches Sprachpaket (EldoUI_Locale_deDE) und Gruppen-Pinnwand (EldoUI_GroupBoard).

          **Installieren:** Spiel schließen, die alten EldoUI-Ordner in \`World of Warcraft\\_forever_\\Interface\\AddOns\` löschen und \`$(basename "$ZIP")\` dorthin entpacken. Die Einstellungen im Ordner \`WTF\` bleiben erhalten.

          WoW: Forever, Interface ${interface}. SHA-256: \`${SHA256}\`
          EOF
          prerelease=()
          case "$TAG" in *-alpha*|*-beta*|*-rc*) prerelease=(--prerelease) ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            # --target only counts when the tag doesn't exist yet (started from GitHub).
            gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" --title "conUI ${VERSION}" \
              --notes-file notes.md --generate-notes "${prerelease[@]}"
          fi
